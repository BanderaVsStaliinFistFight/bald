 ### Decision category
 oic_category:0 "Leaders and the Inner Circle"
 oic_category_desc:0 "Any advisor, general or admiral of [ROOT.GetNameDef] can be made its leader or seated in the Inner Circle.\n\n[oic_GetCandidateLine]\n\n§YInner Circle:§! [?oic_members|0] members ([?oic_statesmen|0] statesmen, [?oic_officers|0] officers, [?oic_admirals|0] admirals)."
 oic_candidate_line:0 "§YCandidate§! ([?oic_pos|0] of [?oic_n|0], [oic_GetFilterName]): §Y[?oic_candidate.GetName]§!, [oic_GetCandidateRole]. [oic_GetCandidateStatus]"
 oic_no_candidate_line:0 "No one is selected. Take §YNext Candidate§! to browse, or §YBrowse§! to change who is listed."

